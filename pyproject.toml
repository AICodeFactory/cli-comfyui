[project]
name = "cli-comfyui"
version = "0.1.0"
description = "CLI for ComfyUI workflow execution and result queries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/AICodeFactory/cli-comfyui"
Repository = "https://github.com/AICodeFactory/cli-comfyui"
Issues = "https://github.com/AICodeFactory/cli-comfyui/issues"

dependencies = [
    "comfykit>=0.1.12",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
]

[project.scripts]
comfyui-cli = "cli_comfyui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_comfyui"]
